<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>No Temas 365 — Producción</title>
<style>
  :root{
    --azul:#011D3A; --dorado:#C09035; --dorado-texto:#805718;
    --crema:#FAF5F0; --panel:#F2EBDD; --ok:#3a7d44; --error:#a83232;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--crema); color:var(--azul); padding:24px 16px 80px;
  }
  h1{font-size:20px; margin:0 0 4px;}
  h2{font-size:16px; margin:0;}
  p.sub{color:#555; margin:0 0 24px; font-size:14px;}

  #login{max-width:340px; margin:60px auto; text-align:center;}
  #login input{
    width:100%; padding:12px; font-size:16px; border:1px solid #ccc;
    border-radius:8px; margin-bottom:12px;
  }
  #login button{
    background:var(--azul); color:#fff; border:none; padding:12px 20px;
    border-radius:8px; font-size:15px; cursor:pointer;
  }

  #app{display:none; max-width:1180px; margin:0 auto;}
  .layout{display:flex; gap:24px; align-items:flex-start;}
  @media (max-width:720px){ .layout{flex-direction:column;} }

  /* ── Calendario ─────────────────────────────────────────────── */
  #calendario{
    background:#fff; border-radius:14px; padding:18px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); width:300px; flex-shrink:0;
  }
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-header button{
    background:none; border:none; font-size:18px; cursor:pointer; color:var(--azul);
    padding:4px 8px; border-radius:6px;
  }
  .cal-header button:hover{background:var(--panel);}
  .cal-mes{font-weight:700; text-transform:capitalize;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:11px; color:#999; padding-bottom:4px;}
  .cal-dia{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-size:13px; cursor:pointer; border:2px solid transparent;
    background:var(--crema); color:var(--azul); position:relative;
  }
  .cal-dia:hover{background:var(--panel);}
  .cal-dia.vacio{visibility:hidden; cursor:default;}
  .cal-dia.aprobado{background:var(--ok); color:#fff; font-weight:700;}
  .cal-dia.hoy{border-color:var(--dorado);}
  .cal-dia.seleccionado{border-color:var(--azul); font-weight:700;}
  .cal-leyenda{display:flex; gap:14px; margin-top:14px; font-size:12px; color:#666;}
  .cal-leyenda span{display:inline-flex; align-items:center; gap:5px;}
  .cal-dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .cal-dot.aprobado{background:var(--ok);}
  .cal-dot.hoy{background:var(--crema); border:2px solid var(--dorado);}

  /* ── Panel de detalle ───────────────────────────────────────── */
  #detalle{
    background:#fff; border-radius:14px; padding:18px; flex:1;
    box-shadow:0 1px 4px rgba(0,0,0,.08); min-height:400px;
  }
  /* Panel de detalle en dos columnas: texto/reflexión a la izquierda,
     video/acciones a la derecha. En pantallas angostas se apilan. */
  .detalle-cols{display:flex; gap:24px; align-items:flex-start;}
  .detalle-texto{flex:1 1 280px; min-width:0;}
  .detalle-video{flex:1.4 1 380px; min-width:0;}
  @media (max-width:640px){ .detalle-cols{flex-direction:column;} }

  .dia-fecha{font-weight:700; text-transform:capitalize; margin-bottom:2px;}
  .dia-ref{color:var(--dorado-texto); font-weight:600; margin-bottom:10px;}
  .dia-versiculo{font-size:14px; color:#333; margin-bottom:14px; line-height:1.4;}
  .reflexion-edit{margin-bottom:14px;}
  .reflexion-label{display:block; font-size:12px; font-weight:700; color:#888; margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  summary.reflexion-label{cursor:pointer; user-select:none; margin-bottom:0; padding:2px 0;}
  details.reflexion-edit summary.reflexion-label{margin-bottom:8px;}
  .reflexion-textarea{
    width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px;
    font-size:14px; font-family:inherit; color:#333; resize:vertical;
  }
  .reflexion-acciones{display:flex; align-items:center; gap:10px; margin-top:6px;}
  .guardar-reflexion-btn{
    background:var(--azul); color:#fff; border:none;
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .msg-reflexion{font-size:13px;}
  .msg-reflexion.ok{color:var(--ok);}
  .msg-reflexion.error{color:var(--error);}
  .preview-wrap{position:relative; margin-bottom:12px;}
  .preview-wrap img.preview,.preview-wrap video.preview-video{
    width:100%; aspect-ratio:16/10; height:auto; object-fit:cover; border-radius:10px;
    background:linear-gradient(135deg, #2a3038, #1a1e24); display:block;
  }
  .preview-wrap .sin-foto{
    width:100%; aspect-ratio:16/10; border-radius:10px;
    background:linear-gradient(135deg, #2a3038, #1a1e24);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.7); font-size:14px;
  }
  .play-btn{
    position:absolute; bottom:10px; right:10px;
    width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(1,29,58,.75); color:#fff; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .play-btn:hover{background:rgba(1,29,58,.95);}
  .estado{font-size:13px; margin-bottom:14px; color:#888;}
  .aprobar-btn{
    background:#fff; color:var(--ok); border:2px solid var(--ok);
    padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600;
  }
  .aprobar-btn.activo{background:var(--ok); color:#fff;}
  .otro-btn{
    background:#fff; color:var(--azul); border:2px solid #ccc;
    padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600;
  }
  .otro-btn:hover{background:#f5f5f5;}
  .acciones{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .pexels-url-form{display:flex; gap:8px; width:100%; margin-top:2px;}
  .pexels-url-form input{
    flex:1; padding:9px 12px; border:1px solid #ccc; border-radius:8px; font-size:13px;
  }
  .pexels-url-form button{
    background:#fff; color:var(--azul); border:2px solid var(--azul);
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
    white-space:nowrap;
  }
  .msg{font-size:13px; margin-left:4px; width:100%;}
  .msg.ok{color:var(--ok);}
  .pagina-pexels{width:100%; margin-bottom:6px;}
  .pagina-pexels a{color:var(--dorado-texto); font-size:13px; font-weight:600; text-decoration:none;}
  .pagina-pexels a:hover{text-decoration:underline;}
  .video-url{display:flex; gap:8px; width:100%; margin-top:2px;}
  .video-url input{
    flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:8px;
    font-size:12px; color:#666; background:var(--panel);
  }
  .video-url button{
    background:#fff; color:var(--azul); border:2px solid #ccc;
    padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600;
    white-space:nowrap;
  }
  .msg.error{color:var(--error);}
  #cargando-detalle{color:#888; padding:60px 0; text-align:center;}

  /* Va debajo del calendario (columna angosta, ~300px) — por eso se
     apila: imagen arriba, controles abajo, todo centrado. */
  #calendario-imagen{margin-top:16px; padding-top:16px; border-top:1px solid #eee;}
  #calendario-imagen .reflexion-label{text-align:center; margin-bottom:10px;}
  #calendario-imagen .reflexion-acciones{justify-content:center;}
  .imagen-compartir-edit{
    padding:12px; border:1px dashed #ddd; border-radius:10px; background:#fafafa;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
  }
  .imagen-compartir-preview{
    width:150px; height:267px; object-fit:cover; border-radius:8px; display:block;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .imagen-compartir-vacia{
    width:150px; height:267px; box-sizing:border-box;
    font-size:12px; color:#888; background:#f0f0f0; border-radius:8px;
    padding:10px; text-align:center; display:flex; align-items:center; justify-content:center;
  }
  .imagen-compartir-controles{width:100%;}
  .imagen-compartir-input{font-size:13px; margin:0 auto 8px; display:block; max-width:100%;}
  .subir-imagen-btn{
    background:var(--azul); color:#fff; border:none;
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .subir-imagen-btn:disabled{opacity:.6; cursor:default;}
  .msg-imagen{font-size:13px; display:block; margin-top:6px;}
  .msg-imagen.ok{color:var(--ok);}
  .msg-imagen.error{color:var(--error);}
  .imagen-compartir-ayuda{font-size:12px; color:#999; margin-top:6px; line-height:1.4;}
</style>
</head>
<body>

<div id="login">
  <h1>No Temas 365 — Producción</h1>
  <p class="sub">Revisa y aprueba los fondos, día por día</p>
  <input type="password" id="password" placeholder="Contraseña">
  <button id="btn-entrar">Entrar</button>
  <p class="msg error" id="login-error"></p>
</div>

<div id="app">
  <h1>Fondos por día</h1>
  <div class="layout">
    <div id="calendario">
      <div class="cal-header">
        <button id="mes-anterior">←</button>
        <span class="cal-mes" id="cal-mes-label"></span>
        <button id="mes-siguiente">→</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-leyenda">
        <span><span class="cal-dot aprobado"></span> Aprobado</span>
        <span><span class="cal-dot hoy"></span> Hoy</span>
      </div>
      <div id="calendario-imagen"></div>
    </div>
    <div id="detalle">
      <div id="cargando-detalle">Elige un día del calendario ←</div>
    </div>
  </div>
</div>

<script>
  // ⚠️ Pega aquí la URL de tu Web App de Apps Script (termina en /exec).
  const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwMFbxzi_BIC59bULyZuF5PI6z9oeGMGgawxvG8TkS1UvSGzkEYksdaxh8o7kNrN2oF/exec";

  let PASSWORD = "";
  let aprobadosSet = new Set();
  let mesMostrado = new Date(); // primer día del mes que se está viendo
  mesMostrado.setDate(1);
  let fechaSeleccionada = null;

  document.getElementById("btn-entrar").addEventListener("click", entrar);
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") entrar();
  });

  // Apps Script a veces tarda varios segundos en "despertar" si nadie lo ha
  // usado en un rato, y esa primera petición puede fallar o responder con
  // una página de error de Google en vez de JSON. Por eso cada petición
  // (GET o POST) se reintenta un par de veces, con una pausa entre
  // intentos para darle tiempo real a Google, antes de mostrar un error.
  function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function peticionConReintento(url, opciones) {
    const intentosMax = 3;
    for (let intento = 0; intento < intentosMax; intento++) {
      try {
        const resp = await fetch(url, opciones);
        return await resp.json();
      } catch (e) {
        if (intento === intentosMax - 1) throw e;
        await esperar(1500 * (intento + 1)); // 1.5s, luego 3s
      }
    }
  }

  async function entrar() {
    const pass = document.getElementById("password").value.trim();
    if (!pass) return;
    const boton = document.getElementById("btn-entrar");
    document.getElementById("login-error").textContent = "";
    boton.disabled = true;
    boton.textContent = "Entrando…";
    PASSWORD = pass;
    try {
      await cargarAprobados();
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      pintarCalendario();
      const hoyISO = formatearISO(new Date());
      seleccionarDia(hoyISO);
    } catch (e) {
      document.getElementById("login-error").textContent = "Error real: " + e.message;
    } finally {
      boton.disabled = false;
      boton.textContent = "Entrar";
    }
  }

  function escapeHtml(texto) {
    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function formatearISO(fecha) {
    const y = fecha.getFullYear(), m = String(fecha.getMonth() + 1).padStart(2, "0"), d = String(fecha.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  async function cargarAprobados() {
    const datos = await peticionConReintento(
      URL_BACKEND + "?password=" + encodeURIComponent(PASSWORD) + "&soloAprobados=1"
    );
    if (!datos.ok) throw new Error(datos.error || "Error desconocido");
    aprobadosSet = new Set(datos.aprobados);
  }

  // ── Calendario ──────────────────────────────────────────────
  document.getElementById("mes-anterior").addEventListener("click", () => {
    mesMostrado.setMonth(mesMostrado.getMonth() - 1);
    pintarCalendario();
  });
  document.getElementById("mes-siguiente").addEventListener("click", () => {
    mesMostrado.setMonth(mesMostrado.getMonth() + 1);
    pintarCalendario();
  });

  function pintarCalendario() {
    const label = mesMostrado.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
    document.getElementById("cal-mes-label").textContent = label;

    const grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    ["Lu","Ma","Mi","Ju","Vi","Sá","Do"].forEach(d => {
      const el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    const primerDia = new Date(mesMostrado.getFullYear(), mesMostrado.getMonth(), 1);
    const ultimoDia = new Date(mesMostrado.getFullYear(), mesMostrado.getMonth() + 1, 0);
    // Lunes = 0 ... Domingo = 6
    const offset = (primerDia.getDay() + 6) % 7;
    const hoyISO = formatearISO(new Date());

    for (let i = 0; i < offset; i++) {
      const vacio = document.createElement("div");
      vacio.className = "cal-dia vacio";
      grid.appendChild(vacio);
    }

    for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
      const fecha = new Date(mesMostrado.getFullYear(), mesMostrado.getMonth(), dia);
      const fechaISO = formatearISO(fecha);
      const celda = document.createElement("div");
      celda.className = "cal-dia";
      if (aprobadosSet.has(fechaISO)) celda.classList.add("aprobado");
      if (fechaISO === hoyISO) celda.classList.add("hoy");
      if (fechaISO === fechaSeleccionada) celda.classList.add("seleccionado");
      celda.textContent = dia;
      celda.addEventListener("click", () => seleccionarDia(fechaISO));
      grid.appendChild(celda);
    }
  }

  // ── Panel de detalle ────────────────────────────────────────
  async function seleccionarDia(fechaISO) {
    fechaSeleccionada = fechaISO;
    pintarCalendario();
    const detalle = document.getElementById("detalle");
    detalle.innerHTML = `<div id="cargando-detalle">Cargando…</div>`;

    try {
      const datos = await peticionConReintento(
        URL_BACKEND + "?password=" + encodeURIComponent(PASSWORD) + "&fechaInicio=" + fechaISO + "&dias=1"
      );
      if (!datos.ok) throw new Error(datos.error || "Error desconocido");
      pintarDetalle(datos.dias[0]);
      pintarImagenCompartir(datos.dias[0]);
    } catch (e) {
      detalle.innerHTML = `<div id="cargando-detalle">No se pudo cargar: ${e.message}</div>`;
      document.getElementById("calendario-imagen").innerHTML = "";
    }
  }

  // Bloque de la imagen propia para "Compartir la promesa de hoy" — vive
  // debajo del calendario, no en el panel de detalle, para dejarle más
  // espacio al texto y al video.
  function pintarImagenCompartir(dia) {
    const cont = document.getElementById("calendario-imagen");
    cont.innerHTML = `
      <label class="reflexion-label">Imagen para compartir</label>
      <div class="imagen-compartir-edit">
        ${dia.imagenCompartir
          ? `<img class="imagen-compartir-preview" src="${dia.imagenCompartir}" alt="Imagen para compartir">`
          : `<div class="imagen-compartir-vacia">Sin imagen propia — usa el video de fondo</div>`}
        <div class="imagen-compartir-controles">
          <input type="file" accept="image/*" class="imagen-compartir-input" id="imagen-compartir-input">
          <div class="reflexion-acciones">
            <button type="button" class="subir-imagen-btn">Subir imagen</button>
            <span class="msg-imagen"></span>
          </div>
          <div class="imagen-compartir-ayuda">Se recorta sola a formato vertical (1080×1920 px) — sube cualquier foto y ella la ajusta.</div>
        </div>
      </div>
    `;
    cont.querySelector(".subir-imagen-btn").addEventListener("click", () => {
      const input = cont.querySelector(".imagen-compartir-input");
      const archivo = input.files && input.files[0];
      const msg = cont.querySelector(".msg-imagen");
      if (!archivo) {
        msg.textContent = "Primero elige una imagen.";
        msg.className = "msg-imagen error";
        return;
      }
      subirImagenCompartir(dia.fila, archivo);
    });
  }

  function pintarDetalle(dia) {
    const detalle = document.getElementById("detalle");
    const fechaCap = dia.fecha.charAt(0).toUpperCase() + dia.fecha.slice(1);
    const etiquetaOrigen = dia.origen === "subido" ? "📤 Video propio"
      : dia.origen === "pexels" ? "🌄 Paisaje de Pexels"
      : "⏳ Sin asignar todavía";

    const sinFotoPropia = !dia.poster && dia.origen === "subido";
    const previewHTML = sinFotoPropia
      ? `<div class="preview sin-foto">🎬 Video propio — usa ▶ para verlo</div>`
      : `<img class="preview" src="${dia.poster || ''}" alt="Vista previa del fondo">`;

    detalle.innerHTML = `
      <div class="detalle-cols">
        <div class="detalle-texto">
          <div class="dia-fecha">${fechaCap}</div>
          <div class="dia-ref">${dia.referencia}</div>
          <div class="dia-versiculo">${dia.versiculo}</div>
          <details class="reflexion-edit" open>
            <summary class="reflexion-label">Reflexión del día</summary>
            <textarea class="reflexion-textarea" rows="4">${escapeHtml(dia.reflexion || "")}</textarea>
            <div class="reflexion-acciones">
              <button type="button" class="guardar-reflexion-btn">Guardar reflexión</button>
              <span class="msg-reflexion"></span>
            </div>
          </details>
        </div>
        <div class="detalle-video">
          <div class="preview-wrap">
            ${previewHTML}
            <video class="preview-video" muted loop playsinline style="display:none;"></video>
            ${dia.videoActual ? '<button class="play-btn" title="Ver en movimiento">▶</button>' : ''}
          </div>
          <div class="estado">${etiquetaOrigen}${dia.videoActualizado ? ' · cambiado el ' + dia.videoActualizado : ''}</div>
          ${dia.paginaPexels ? `
          <div class="pagina-pexels">
            <a href="${dia.paginaPexels}" target="_blank" rel="noopener">🔗 Ver este video en Pexels</a>
          </div>` : ''}
          ${dia.videoActual ? `
          <div class="video-url">
            <input type="text" readonly value="${dia.videoActual}" onclick="this.select()">
            <button type="button" class="copiar-url-btn">Copiar URL del archivo</button>
          </div>` : ''}
          <div class="acciones">
            <button class="aprobar-btn ${dia.aprobado ? 'activo' : ''}" data-aprobado="${dia.aprobado}">
              ${dia.aprobado ? '✓ Aprobado' : 'Aprobar este día'}
            </button>
            <button class="otro-btn">🔄 Otro paisaje</button>
            <span class="msg"></span>
            <form class="pexels-url-form">
              <input type="url" placeholder="Pega aquí el enlace del video en pexels.com" required>
              <button type="submit">Usar este video</button>
            </form>
          </div>
        </div>
      </div>
    `;

    const imgGrande = detalle.querySelector(".preview");
    const videoGrande = detalle.querySelector(".preview-video");

    const btnPlay = detalle.querySelector(".play-btn");
    if (btnPlay) {
      btnPlay.addEventListener("click", () => {
        const enReproduccion = videoGrande.style.display !== "none";
        if (enReproduccion) {
          videoGrande.pause();
          videoGrande.style.display = "none";
          if (imgGrande) imgGrande.style.display = "block";
        } else {
          if (!videoGrande.src) videoGrande.src = dia.videoActual;
          if (imgGrande) imgGrande.style.display = "none";
          videoGrande.style.display = "block";
          videoGrande.play().catch(() => {});
        }
      });
    }

    detalle.querySelector(".otro-btn").addEventListener("click", () => pedirOtroPaisaje(dia.fila, dia.fechaISO));
    const btnCopiar = detalle.querySelector(".copiar-url-btn");
    if (btnCopiar) {
      btnCopiar.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(dia.videoActual);
          btnCopiar.textContent = "¡Copiado!";
        } catch (e) {
          detalle.querySelector(".video-url input").select();
          document.execCommand("copy");
          btnCopiar.textContent = "¡Copiado!";
        }
        setTimeout(() => { btnCopiar.textContent = "Copiar URL"; }, 1500);
      });
    }
    detalle.querySelector(".aprobar-btn").addEventListener("click", (e) => {
      const yaAprobado = e.target.dataset.aprobado === "true";
      marcarAprobado(dia.fechaISO, !yaAprobado);
    });
    detalle.querySelector(".pexels-url-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = e.target.querySelector("input");
      const url = input.value.trim();
      if (url) usarVideoPorUrl(url, dia.fila, dia.fechaISO);
    });
    detalle.querySelector(".guardar-reflexion-btn").addEventListener("click", () => {
      const texto = detalle.querySelector(".reflexion-textarea").value;
      guardarReflexion(dia.fila, texto);
    });
  }

  // Recorta/ajusta cualquier foto que suban al formato vertical fijo que
  // usa la imagen de "Compartir la promesa de hoy" (estilo "cover", igual
  // que hace la propia web con el video de fondo) — así no toca acertarle
  // a la medida exacta, cualquier foto queda bien.
  function recortarAFormatoCompartir(archivo) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => {
        const img = new Image();
        img.onload = () => {
          const W = 1080, H = 1920;
          const canvas = document.createElement("canvas");
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext("2d");
          const escala = Math.max(W / img.width, H / img.height);
          const iw = img.width * escala, ih = img.height * escala;
          ctx.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);

          // Comprime en pasos hasta dejarla liviana. Una foto de celular
          // recortada a 1080×1920 con calidad alta puede pesar varios MB,
          // y en algunos Android eso hace que la pantalla de compartir de
          // WhatsApp se quede en negro mientras intenta generar la vista
          // previa de un archivo tan pesado.
          const LIMITE_BYTES = 350 * 1024; // 350 KB
          const probar = (calidad) => {
            canvas.toBlob(blob => {
              if (!blob) { reject(new Error("No se pudo procesar la imagen.")); return; }
              if (blob.size <= LIMITE_BYTES || calidad <= 0.5) resolve(blob);
              else probar(calidad - 0.1);
            }, "image/jpeg", calidad);
          };
          probar(0.85);
        };
        img.onerror = () => reject(new Error("El archivo no es una imagen válida."));
        img.src = lector.result;
      };
      lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
      lector.readAsDataURL(archivo);
    });
  }

  function blobABase64(blob) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onloadend = () => resolve(lector.result.split(",")[1]);
      lector.onerror = reject;
      lector.readAsDataURL(blob);
    });
  }

  async function subirImagenCompartir(fila, archivo) {
    const msg = document.querySelector(".msg-imagen");
    if (msg) { msg.textContent = "Procesando imagen…"; msg.className = "msg-imagen"; }
    const boton = document.querySelector(".subir-imagen-btn");
    if (boton) boton.disabled = true;
    try {
      const recortada = await recortarAFormatoCompartir(archivo);
      if (msg) msg.textContent = "Subiendo…";
      const base64 = await blobABase64(recortada);
      const datos = await peticionConReintento(URL_BACKEND, {
        method: "POST",
        body: JSON.stringify({
          password: PASSWORD, accion: "subirImagen", fila,
          datosBase64: base64, nombreArchivo: "imagen.jpg",
        }),
      });
      if (!datos.ok) throw new Error(datos.error || "Error al subir la imagen");
      if (msg) { msg.textContent = "¡Lista!"; msg.className = "msg-imagen ok"; }
      const anterior = document.querySelector(".imagen-compartir-preview, .imagen-compartir-vacia");
      if (anterior) {
        anterior.outerHTML = `<img class="imagen-compartir-preview" src="${datos.url}" alt="Imagen para compartir">`;
      }
    } catch (e) {
      if (msg) { msg.textContent = "No se pudo subir: " + e.message; msg.className = "msg-imagen error"; }
    } finally {
      if (boton) boton.disabled = false;
    }
  }

  async function guardarReflexion(fila, reflexion) {
    const msg = document.querySelector(".msg-reflexion");
    if (msg) { msg.textContent = "Guardando…"; msg.className = "msg-reflexion"; }
    try {
      const datos = await peticionConReintento(URL_BACKEND, {
        method: "POST",
        body: JSON.stringify({ password: PASSWORD, accion: "guardarReflexion", fila, reflexion }),
      });
      if (!datos.ok) throw new Error(datos.error || "Error al guardar la reflexión");
      if (msg) { msg.textContent = "¡Guardado!"; msg.className = "msg-reflexion ok"; }
    } catch (e) {
      if (msg) { msg.textContent = "No se pudo guardar: " + e.message; msg.className = "msg-reflexion error"; }
    }
  }

  function mensajeDetalle(texto, tipo) {
    const msg = document.querySelector("#detalle .msg");
    if (!msg) return;
    msg.textContent = texto;
    msg.className = "msg" + (tipo ? " " + tipo : "");
  }

  async function pedirOtroPaisaje(fila, fechaISO) {
    mensajeDetalle("Buscando otro paisaje…");
    try {
      const datos = await peticionConReintento(URL_BACKEND, {
        method: "POST", body: JSON.stringify({ password: PASSWORD, accion: "otro", fila, fechaISO }),
      });
      if (!datos.ok) throw new Error(datos.error || "Error al buscar otro paisaje");
      await cargarAprobados(); // "otro" también quita la aprobación anterior
      pintarCalendario();
      await seleccionarDia(fechaISO);
    } catch (e) {
      mensajeDetalle("No se pudo cambiar: " + e.message, "error");
    }
  }

  async function usarVideoPorUrl(url, fila, fechaISO) {
    mensajeDetalle("Buscando ese video en Pexels…");
    try {
      const datos = await peticionConReintento(URL_BACKEND, {
        method: "POST", body: JSON.stringify({ password: PASSWORD, accion: "porUrl", fila, fechaISO, url }),
      });
      if (!datos.ok) throw new Error(datos.error || "Error al usar ese video");
      await cargarAprobados(); // también quita la aprobación anterior
      pintarCalendario();
      await seleccionarDia(fechaISO);
    } catch (e) {
      mensajeDetalle("No se pudo usar ese video: " + e.message, "error");
    }
  }

  async function marcarAprobado(fechaISO, aprobado) {
    mensajeDetalle("Guardando…");
    try {
      const datos = await peticionConReintento(URL_BACKEND, {
        method: "POST", body: JSON.stringify({ password: PASSWORD, fechaISO, aprobado }),
      });
      if (!datos.ok) throw new Error(datos.error || "Error al guardar");
      await cargarAprobados();
      pintarCalendario();
      await seleccionarDia(fechaISO);
    } catch (e) {
      mensajeDetalle("No se pudo guardar: " + e.message, "error");
    }
  }
