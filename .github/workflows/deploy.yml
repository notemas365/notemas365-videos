name: Actualizar video y desplegar el sitio

on:
  schedule:
    # 05:10 UTC = 12:10 AM hora Colombia (UTC-5, todo el año, sin horario de verano)
    - cron: "10 5 * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "produccion.html"
      - "archivo.html"
      - "manifest.json"
      - "icon-192.png"
      - "icon-512.png"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña "Actions" de GitHub, para probar

jobs:
  actualizar-y-subir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consultar el video de hoy e inyectarlo en index.html
        env:
          PRODUCCION_PASSWORD: ${{ secrets.PRODUCCION_PASSWORD }}
        run: node actualizar-video.js

      - name: Preparar carpeta a subir
        run: |
          mkdir -p a_subir
          cp index.html a_subir/index.html
          [ -f produccion.html ] && cp produccion.html a_subir/produccion.html || true
          [ -f archivo.html ] && cp archivo.html a_subir/archivo.html || true
          [ -f manifest.json ] && cp manifest.json a_subir/manifest.json || true
          [ -f icon-192.png ] && cp icon-192.png a_subir/icon-192.png || true
          [ -f icon-512.png ] && cp icon-512.png a_subir/icon-512.png || true
          # La copia local del video de hoy (descargada por actualizar-video.js).
          # No se guarda en el repo (es un archivo generado cada noche), solo
          # vive en esta carpeta temporal del workflow y se sube a Hostinger.
          [ -d videos-dia ] && cp -r videos-dia a_subir/videos-dia || true

      - name: Subir a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./a_subir/
          server-dir: ./
          # Nunca borra nada que ya esté en el servidor — solo sube/reemplaza
          # los archivos de a_subir/. Así cualquier otro archivo que tengas
          # en Hostinger y no esté en este repo queda intacto.
          dangerous-clean-slate: false
