<style>
  :root{
    --azul:#011D3A;
    --azul-2:#0B2C50;
    --dorado:#C09035;
    --dorado-texto:#805718;
    --dorado-soft:#D2A552;
    --crema:#FAF5F0;
    --panel:#F2EBDD;
    --ink:#011D3A;
    --ink-soft:#4B5A70;
    --card:#FFFFFF;
    --line:#E7E1D3;
  }
  html[data-tema="oscuro"]{
    --crema:#12181F;
    --panel:#1A222C;
    --ink:#F2EFEA;
    --ink-soft:#A9B4C2;
    --card:#1E2733;
    --line:#2A3440;
    --dorado-texto:#D2A552;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  h1,h2{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:-.01em;margin:0;}
  a{color:inherit;}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px;}

  header{
    background:var(--crema);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:820px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand img{height:32px;width:auto;}
  .volver{
    text-decoration:none;
    color:var(--azul);
    font-weight:600;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
  }
  .volver:hover{background:var(--panel);}

  .encabezado{padding:56px 24px 32px;text-align:center;}
  .encabezado .kicker{color:var(--dorado-texto);font-size:14px;font-weight:700;margin-bottom:14px;}
  .encabezado h1{font-size:32px;color:var(--ink);}
  .encabezado p{color:var(--ink-soft);font-size:16px;margin-top:14px;max-width:56ch;margin-left:auto;margin-right:auto;}

  .buscador{
    max-width:400px;margin:28px auto 0;
    display:flex;align-items:center;gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 16px;
  }
  .buscador svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .buscador input{
    border:none;outline:none;background:none;
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    width:100%;
  }
  .buscador input::placeholder{color:var(--ink-soft);}

  .lista{padding:16px 24px 80px;}
  .archivo-item{border-bottom:1px solid var(--line);}
  .archivo-item summary{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 4px;cursor:pointer;list-style:none;
  }
  .archivo-item summary::-webkit-details-marker{display:none;}
  .archivo-item summary:hover .archivo-fecha{color:var(--dorado-texto);}
  .archivo-cabecera{display:flex;align-items:baseline;gap:14px;min-width:0;}
  .archivo-fecha{font-size:14px;font-weight:700;color:var(--ink);text-transform:capitalize;white-space:nowrap;}
  .archivo-ref{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .archivo-chevron{flex-shrink:0;width:18px;height:18px;color:var(--ink-soft);transition:transform .2s ease;}
  .archivo-item[open] .archivo-chevron{transform:rotate(180deg);}
  .archivo-texto{color:var(--ink);font-size:15px;line-height:1.65;padding:0 4px 20px;max-width:64ch;}
  .archivo-texto cite{color:var(--ink-soft);font-style:normal;display:block;margin-top:4px;}

  // Mismo ancla de fecha que index.html: día 1 = 1 de septiembre 2026 = fila 1.
  const FECHA_INICIO = new Date(2026, 8, 1);
  const hoy = new Date();
  const hoySinHora = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const diasTranscurridos = Math.round((hoySinHora - FECHA_INICIO) / 86400000);

  const URL_HOJA_CALCULO = "https://docs.google.com/spreadsheets/d/1pFWHM14rfz17dh1WXM2D4FVo648ZftQMHoKVAMwRODE/export?format=csv";

  function parseCSV(texto) {
    const filas = [];
    let fila = [];
    let campo = "";
    let dentroComillas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (dentroComillas) {
        if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
        else if (c === '"') { dentroComillas = false; }
        else { campo += c; }
      } else {
        if (c === '"') dentroComillas = true;
        else if (c === ',') { fila.push(campo); campo = ""; }
        else if (c === '\n') { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
        else if (c === '\r') { /* ignorar */ }
        else { campo += c; }
      }
    }
    if (campo.length || fila.length) { fila.push(campo); filas.push(fila); }
    return filas.filter(f => f.some(c => c.trim() !== ""));
  }

  const formateador = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const contenedor = document.getElementById("archivo-lista");
  const botonCargarMas = document.getElementById("btn-cargar-mas");
  const buscadorInput = document.getElementById("buscador-input");
  const sinResultados = document.getElementById("sin-resultados");

  const LOTE = 30;
  let versiculosGlobal = [];
  let siguienteOffset = 0;

  function construirFila(offsetDias) {
    const fecha = new Date(hoySinHora);
    fecha.setDate(fecha.getDate() - offsetDias);
    const dia = diasTranscurridos - offsetDias;
    const idx = ((dia % versiculosGlobal.length) + versiculosGlobal.length) % versiculosGlobal.length;
    const v = versiculosGlobal[idx];
    const fila = document.createElement("details");
    fila.className = "archivo-item";
    const fechaTexto = offsetDias === 0 ? "Hoy" : formateador.format(fecha);
    const reflexionHTML = v.reflexion ? '<p class="archivo-reflexion">' + v.reflexion + '</p>' : '';
    fila.dataset.buscar = (v.ref + " " + v.texto).toLowerCase();
    fila.innerHTML =
      '<summary>' +
        '<span class="archivo-cabecera">' +
          '<span class="archivo-fecha">' + fechaTexto + '</span>' +
          '<span class="archivo-ref">' + v.ref + '</span>' +
        '</span>' +
        '<svg class="archivo-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
      '</summary>' +
      '<div class="archivo-texto">' + v.texto + ' <cite>— ' + v.ref + ' (LBLA)</cite>' + reflexionHTML + '</div>';
    return fila;
  }

  function cargarSiguienteLote() {
    const hasta = Math.min(siguienteOffset + LOTE, diasTranscurridos + 1);
    for (let i = siguienteOffset; i < hasta; i++) {
      contenedor.appendChild(construirFila(i));
    }
    siguienteOffset = hasta;
    botonCargarMas.style.display = siguienteOffset <= diasTranscurridos ? "block" : "none";
    aplicarBusqueda();
  }

  function aplicarBusqueda() {
    const termino = buscadorInput.value.trim().toLowerCase();
    const filas = contenedor.querySelectorAll(".archivo-item");
    let algunaVisible = false;
    filas.forEach(f => {
      const coincide = !termino || f.dataset.buscar.includes(termino);
      f.classList.toggle("archivo-oculto", !coincide);
      if (coincide) algunaVisible = true;
    });
    sinResultados.style.display = (termino && !algunaVisible) ? "block" : "none";
    // Si hay búsqueda activa, ocultamos "cargar más" para no confundir
    // (se puede seguir cargando más días borrando la búsqueda).
    if (termino) botonCargarMas.style.display = "none";
    else botonCargarMas.style.display = siguienteOffset <= diasTranscurridos ? "block" : "none";
  }

  buscadorInput.addEventListener("input", aplicarBusqueda);
  botonCargarMas.addEventListener("click", cargarSiguienteLote);

  fetch(URL_HOJA_CALCULO)
    .then(r => {
      if (!r.ok) throw new Error("No se pudo leer la hoja");
      return r.text();
    })
    .then(texto => {
      const filas = parseCSV(texto);
      const [encabezado, ...datos] = filas;
      const idx = {
        ref: encabezado.findIndex(h => h.trim().toLowerCase() === "referencia"),
        texto: encabezado.findIndex(h => h.trim().toLowerCase() === "versiculo"),
        reflexion: encabezado.findIndex(h => h.trim().toLowerCase() === "reflexion"),
      };
      versiculosGlobal = datos
        .map(fila => ({
          texto: (fila[idx.texto] || "").trim(),
          ref: (fila[idx.ref] || "").trim(),
          reflexion: (fila[idx.reflexion] || "").trim(),
        }))
        .filter(v => v.texto && v.ref);

      if (!versiculosGlobal.length) throw new Error("La hoja no tiene versículos válidos");

      contenedor.innerHTML = "";
      cargarSiguienteLote();
    })
    .catch(() => {
      contenedor.innerHTML =
        '<p class="error-carga">No pudimos cargar el archivo en este momento. ' +
        'Intenta de nuevo más tarde, o <a href="index.html">vuelve al inicio</a>.</p>';
    });
</script>

</body>
</html>
